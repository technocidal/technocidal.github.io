<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="authorization_endpoint" href="https://indieauth.com/auth">
  <link rel="token_endpoint" href="https://tokens.indieauth.com/token">
  <!-- To use social readers via microsub, follow these steps.
    (Details: https://indieweb.org/Microsub#Getting_Started)
    1. After publishing this to your domain, sign in to https://aperture.p3k.io/login with your domain
    2. You will see a <link> tag displayed on your dashboard that looks like:
      <link rel="microsub" href="https://aperture.p3k.io/microsub/000">
    3. Copy that <link> tag and paste it after this HTML comment.
    4. Publish the updated page!
   -->
  <title>Technocidal</title>
  <script>
    function handleFlickrFeed(data) {
      if (data.items && data.items.length > 0) {
        const latestPhoto = data.items[0];
        const imageUrl = latestPhoto.media.m.replace('_m', '_b');
        document.body.style.backgroundImage = `url('${imageUrl}')`;
      }
    }
    
    function loadFlickrFeed() {
      const flickrId = '195437143@N05';
      const script = document.createElement('script');
      script.src = `https://api.flickr.com/services/feeds/photos_public.gne?nsid=${encodeURIComponent(flickrId)}&format=json&jsoncallback=handleFlickrFeed`;
      script.onerror = function() {
        console.error('Failed to load Flickr feed');
      };
      document.head.appendChild(script);
    }
    
    loadFlickrFeed();
  </script>
  <style>
    @media (prefers-color-scheme: dark) {
      html { background-color: #111111; color: #fbfbfb; }
      a { color: #ca8465; }
    }
    body {
      line-height: 1.6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      margin: 1rem auto;
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: inherit;
      background-size: cover;
      background-position: center;
      z-index: -1;
      filter: blur(2px);
    }
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.6);
      z-index: -1;
    }
    @media (prefers-color-scheme: dark) {
      body::after {
        background: rgba(0, 0, 0, 0.5);
      }
    }
    img.u-photo { border-radius: 50%; }
    ul { padding: 0; list-style: none; }
    main {
      position: relative;
      z-index: 1;
    }
  </style>
</head>

<body id="page-body">

    </h1>

    <p class="p-note">
      I'm a father, software engineer and aspiring coffee snob.
    </p>

    <ul>
      <li><a class="u-uid u-url" href="https://technocidal.com">Technocidal</a></li>      
      <!-- Replace _mygithubid_ with your GitHub username in both places on the next line: -->
      <li>Github: <a class="u-url" href="https://github.com/technocidal" rel="me">@technocidal</a></li>
      <li>Mastodon: <a class="u-url" href="https://gruene.social/@technocidal" rel="me">@technocidal@gruene.social</a></li>
    </ul>
  </main>
</body>

</html>
